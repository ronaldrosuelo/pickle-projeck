<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tournament Bracket</title>
  <style>
    :root {
      --page-1: #e8eedc;
      --page-2: #f1f2dd;
      --card: #eff3e6;
      --card-border: #d2dac3;
      --label: #6b7560;
      --ink: #1f2d20;

      --dark: #243425;
      --dark-2: #2d4030;
      --dark-3: #1a271b;
      --dark-border: #3d543f;
      --cream: #eaeedf;
      --cream-muted: #a9b79f;

      --lime: #7ac12b;
      --lime-light: #92d43c;
      --lime-dark: #5f9e17;
      --lime-ink: #14230f;

      --btn-bg: #e9ecdd;
      --btn-border: #cdd5bd;
      --danger-bg: #f5ddd7;
      --danger-border: #e2b6ac;
      --danger-ink: #9b2c20;

      --font-head: "Barlow Condensed", "Oswald", "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
      --font-mono: "Space Mono", "JetBrains Mono", ui-monospace, Consolas, monospace;
      --radius: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, var(--page-1), var(--page-2)) fixed;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      padding: 18px;
      min-height: 100vh;
    }
    .page { max-width: 1400px; margin: 0 auto; }

    /* Header bar */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; background: linear-gradient(180deg, var(--dark), var(--dark-3)); border: 1px solid var(--dark-border); border-radius: 22px; padding: 16px 22px; box-shadow: 0 6px 16px rgba(26,39,27,.25); }
    .header h1 { font-family: var(--font-head); font-size: 32px; font-weight: 700; color: var(--cream); display: flex; align-items: center; gap: 12px; letter-spacing: .01em; }
    .header h1::before { content: ""; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--lime-light), var(--lime-dark)); border: 2px solid #b8e07a; }
    .back { color: var(--ink); cursor: pointer; font-family: var(--font-head); font-weight: 600; font-size: 18px; padding: 8px 20px; border-radius: 12px; background: var(--btn-bg); border: 1px solid var(--btn-border); box-shadow: 0 3px 6px rgba(0,0,0,.2); }
    .back:hover { background: #f4f6ea; }

    /* Buttons */
    .btn { font-family: var(--font-head); font-size: 17px; font-weight: 600; padding: 8px 18px; border-radius: 12px; cursor: pointer; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--ink); box-shadow: 0 3px 6px rgba(0,0,0,.15); transition: background .15s, transform .05s; }
    .btn:hover { background: #f4f6ea; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: linear-gradient(180deg, var(--lime-light), var(--lime-dark)); border-color: #4a8210; color: var(--lime-ink); }
    .btn-primary:hover { background: linear-gradient(180deg, #a2e04e, #6bb01c); }
    .btn-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-ink); }
    .btn-danger:hover { background: #f9e7e2; }
    .btn-sm { padding: 4px 12px; font-size: 15px; border-radius: 10px; }

    /* Setup panel (light card) */
    .setup { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); margin-bottom: 18px; box-shadow: 0 2px 6px rgba(60,80,40,.08); }
    .setup > summary { list-style: none; cursor: pointer; padding: 16px 20px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--label); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .setup > summary::-webkit-details-marker { display: none; }
    .setup > summary .hint { font-family: system-ui, sans-serif; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; margin-left: auto; }
    .setup > summary::after { content: "▾"; }
    .setup:not([open]) > summary::after { content: "▸"; }
    .setup-body { padding: 0 20px 20px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .brackets-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }

    /* Bracket setup cards (dark, like the decks) */
    .bcard { background: linear-gradient(180deg, var(--dark), var(--dark-3)); border: 1px solid var(--dark-border); border-radius: 18px; padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
    .bcard-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
    .bcard-name { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: var(--cream); }
    .bcard-count { font-family: var(--font-mono); font-size: 11px; color: var(--cream-muted); margin-left: 10px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; }
    .bcard-actions { display: flex; gap: 6px; }
    .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .team-field { display: flex; align-items: center; background: rgba(0,0,0,.18); border: 1px dashed var(--dark-border); border-radius: 12px; padding: 5px; gap: 6px; }
    .team-field:focus-within { border-color: var(--lime); }
    .team-field .num { width: 26px; height: 26px; border-radius: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--cream-muted); background: var(--dark-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .team-input { flex: 1; min-width: 0; background: #f2f4e8; color: var(--ink); border: 1px solid #cfd6bf; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
    .team-input:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 3px rgba(122,193,43,.3); }
    .team-input::placeholder { color: #7f8a74; }

    /* Bracket view (light card + dark match boxes) */
    .tournament-container { display: flex; flex-direction: column; gap: 18px; }
    .bracket-section { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 20px; box-shadow: 0 2px 6px rgba(60,80,40,.08); }
    .bracket-section-title { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--label); margin-bottom: 16px; }
    .tournament-row { display: flex; gap: 44px; align-items: stretch; overflow-x: auto; padding-bottom: 8px; }
    .round { display: flex; flex-direction: column; flex-shrink: 0; }
    .round-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--lime); letter-spacing: .02em; }
    .round .matches { display: flex; flex-direction: column; gap: 14px; }
    .round.po .matches { flex: 1; justify-content: center; }
    .round.rr .matches { display: grid; grid-template-columns: repeat(var(--cols, 1), 210px); gap: 14px 16px; }
    .round.po .match { width: 220px; }

    .match { display: flex; flex-direction: column; border: 1px solid var(--dark-border); border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, var(--dark), var(--dark-3)); box-shadow: 0 3px 8px rgba(26,39,27,.25); }
    .match-label { font-family: var(--font-mono); font-size: 10px; color: var(--cream-muted); text-transform: uppercase; letter-spacing: .14em; padding: 7px 12px 0; }
    .team-box { padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 38px; gap: 10px; border-left: 4px solid transparent; }
    .team-box + .team-box { border-top: 1px solid var(--dark-border); }
    .team-box:hover { background: var(--dark-2); }
    .team-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--cream); }
    .team-score { font-family: var(--font-head); font-size: 20px; font-weight: 700; min-width: 20px; text-align: right; color: var(--cream); }
    .team-box.selected { background: linear-gradient(180deg, var(--lime-light), var(--lime-dark)); border-left-color: #d4f2a3; }
    .team-box.selected .team-name, .team-box.selected .team-score { color: var(--lime-ink); font-weight: 700; }
    .team-box.loser .team-name, .team-box.loser .team-score { color: var(--cream-muted); font-weight: 400; }

    .champion { margin-top: 14px; padding: 10px 12px; background: linear-gradient(180deg, var(--lime-light), var(--lime-dark)); border: 1px solid #4a8210; border-radius: 12px; color: var(--lime-ink); font-family: var(--font-head); font-size: 20px; font-weight: 700; text-align: center; width: 220px; box-shadow: 0 3px 8px rgba(26,39,27,.25); }

    .podium { display: flex; align-items: flex-end; gap: 8px; }
    .podium-step { width: 100px; text-align: center; }
    .podium-name { font-family: var(--font-head); font-weight: 700; font-size: 17px; color: var(--ink); margin-bottom: 6px; word-break: break-word; min-height: 38px; display: flex; align-items: flex-end; justify-content: center; line-height: 1.1; }
    .podium-block { border-radius: 12px 12px 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; font-family: var(--font-head); font-weight: 700; font-size: 28px; background: linear-gradient(180deg, var(--dark-2), var(--dark-3)); border: 1px solid var(--dark-border); border-bottom: none; color: var(--cream); }
    .podium-step.p1 .podium-block { height: 116px; background: linear-gradient(180deg, var(--lime-light), var(--lime-dark)); border-color: #4a8210; color: var(--lime-ink); }
    .podium-step.p2 .podium-block { height: 84px; }
    .podium-step.p3 .podium-block { height: 58px; }
    .podium-fourth { margin-top: 12px; color: var(--label); font-size: 13px; text-align: center; font-family: var(--font-mono); }

    .note { color: var(--label); font-size: 13px; margin: -6px 0 14px; }
    .empty { color: var(--label); padding: 20px; text-align: center; border: 1px dashed #b7c3a2; border-radius: 14px; background: rgba(255,255,255,.35); }

    /* Modal (dark, like the decks) */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(18,30,19,.7); z-index: 999; }
    .modal-overlay.active { display: block; }
    .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(180deg, var(--dark), var(--dark-3)); border: 1px solid var(--dark-border); border-radius: 20px; padding: 24px; z-index: 1000; width: min(420px, 92vw); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
    .modal.active { display: block; }
    .modal-title { font-family: var(--font-head); font-size: 24px; font-weight: 700; color: var(--cream); margin-bottom: 16px; }
    .modal-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-bottom: 10px; align-items: center; text-align: center; }
    .modal-team { font-family: var(--font-head); font-weight: 700; font-size: 19px; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-vs { color: var(--cream-muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; }
    .modal-role { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--cream-muted); margin-bottom: 4px; }
    .modal-role.win { color: var(--lime-light); }
    .modal-inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-bottom: 20px; align-items: center; }
    .modal-inputs span { visibility: hidden; font-size: 12px; }
    .score-input { width: 100%; background: #f2f4e8; color: var(--ink); border: 1px solid #cfd6bf; padding: 12px; border-radius: 12px; font-size: 26px; font-weight: 700; text-align: center; font-family: var(--font-head); }
    .score-input:focus { outline: none; border-color: var(--lime); box-shadow: 0 0 0 3px rgba(122,193,43,.35); }
    .modal-buttons { display: flex; gap: 10px; }
    .modal-buttons .btn { flex: 1; padding: 10px; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .brackets-container { grid-template-columns: 1fr; }
      .header h1 { font-size: 24px; }
      .header h1::before { width: 28px; height: 28px; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>Tournament Bracket</h1>
    <button class="btn btn-primary" id="podium-btn" onclick="openPodiumWindow()" style="display:none;">🏆 Show Podium</button>
    <a class="back" onclick="window.parent.switchTab && window.parent.switchTab('queue')" style="display: none;">← Back</a>
  </div>

  <details class="setup" open>
    <summary>Setup <span class="hint">Collapse to enlarge the bracket view</span></summary>
    <div class="setup-body">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="addBracket()">+ Add Bracket</button>
        <button class="btn btn-danger" onclick="resetTournament()">Reset All</button>
      </div>
      <div class="brackets-container" id="bracketsContainer"></div>
    </div>
  </details>

  <div class="tournament-container" id="bracket"></div>

</div>

<div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-title" id="modalTitle"></div>
  <div class="modal-teams">
    <div>
      <div class="modal-role win">Winner</div>
      <div class="modal-team" id="team1"></div>
    </div>
    <div class="modal-vs">vs</div>
    <div>
      <div class="modal-role">Opponent</div>
      <div class="modal-team" id="team2"></div>
    </div>
  </div>
  <div class="modal-inputs">
    <input type="number" class="score-input" id="score1" placeholder="0" min="0" max="30">
    <span>:</span>
    <input type="number" class="score-input" id="score2" placeholder="0" min="0" max="30">
  </div>
  <div class="modal-buttons">
    <button class="btn btn-primary" onclick="saveScore()">Save Score</button>
    <button class="btn" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  const STORAGE = 'tourn_v2';
  let data = { brackets: [], bracket: {} };
  let currentMatch = null;
  let lastPodium = null; // tracks current podium data for the popup

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function activeTeamsOf(bracket) {
    return bracket.teams.map(t => t.trim()).filter(t => t !== '');
  }

  // Result of a match, oriented to (a, b). Null if there is no result,
  // or if the saved result belongs to different teams.
  function getRes(key, a, b) {
    const r = data.bracket[key];
    if (!r) return null;
    if (r.t1 === a && r.t2 === b) return { sa: r.s1, sb: r.s2, winner: r.winner };
    if (r.t1 === b && r.t2 === a) return { sa: r.s2, sb: r.s1, winner: r.winner };
    return null;
  }

  // ---------- round-robin (circle method, bye rotates inside the array) ----------
  function generateRoundRobin(numTeams) {
    if (numTeams < 2) return [];
    const teams = Array.from({ length: numTeams }, (_, i) => i);
    if (teams.length % 2 !== 0) teams.push(-1);
    const n = teams.length;
    const rounds = [];

    for (let r = 0; r < n - 1; r++) {
      const round = [];
      for (let i = 0; i < n / 2; i++) {
        const t1 = teams[i];
        const t2 = teams[n - 1 - i];
        if (t1 !== -1 && t2 !== -1) round.push({ t1, t2 });
      }
      rounds.push(round);
      teams.splice(1, 0, teams.pop());
    }
    return rounds;
  }

  // ---------- storage ----------
  function load() { try { data = JSON.parse(localStorage.getItem(STORAGE)) || data; } catch (e) {} }
  function save() { localStorage.setItem(STORAGE, JSON.stringify(data)); }

  // ---------- setup actions ----------
  window.addBracket = () => {
    const name = `Bracket ${String.fromCharCode(65 + data.brackets.length)}`;
    data.brackets.push({ name, teams: Array(6).fill('') });
    save();
    render();
  };

  window.delBracket = (idx) => {
    if (data.brackets.length <= 1) {
      alert('Must have at least one bracket');
      return;
    }
    data.brackets.splice(idx, 1);

    const next = {};
    Object.keys(data.bracket).forEach(key => {
      const sep = key.indexOf('_');
      const bi = parseInt(key.slice(0, sep));
      const rest = key.slice(sep);
      if (bi < idx) next[key] = data.bracket[key];
      else if (bi > idx) next[`${bi - 1}${rest}`] = data.bracket[key];
    });
    data.bracket = next;

    save();
    render();
  };

  window.addTeam = (bracketIdx) => {
    if (data.brackets[bracketIdx].teams.length < 16) {
      data.brackets[bracketIdx].teams.push('');
      save();
      render();
    }
  };

  window.delTeam = (bracketIdx) => {
    if (data.brackets[bracketIdx].teams.length > 2) {
      data.brackets[bracketIdx].teams.pop();
      save();
      render();
    }
  };

  window.resetTournament = () => {
    if (confirm('Clear all tournament data? This cannot be undone.')) {
      data = { brackets: [
        { name: 'Bracket A', teams: Array(6).fill('') },
        { name: 'Bracket B', teams: Array(6).fill('') }
      ], bracket: {} };
      save();
      render();
    }
  };

  // ---------- setup panel ----------
  function renderBrackets() {
    const container = document.getElementById('bracketsContainer');
    container.innerHTML = '';

    data.brackets.forEach((bracket, bracketIdx) => {
      const card = document.createElement('div');
      card.className = 'bcard';

      const head = document.createElement('div');
      head.className = 'bcard-head';
      head.innerHTML = `
        <div class="bcard-name">${esc(bracket.name)}<span class="bcard-count">${bracket.teams.length} slots</span></div>
        <div class="bcard-actions">
          <button class="btn btn-sm" onclick="addTeam(${bracketIdx})">+ Team</button>
          <button class="btn btn-sm" onclick="delTeam(${bracketIdx})">− Team</button>
          <button class="btn btn-sm btn-danger" onclick="delBracket(${bracketIdx})">Delete</button>
        </div>
      `;
      card.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'team-grid';

      bracket.teams.forEach((name, i) => {
        const field = document.createElement('label');
        field.className = 'team-field';
        field.innerHTML = `<span class="num">${i + 1}</span>`;

        const inp = document.createElement('input');
        inp.className = 'team-input';
        inp.placeholder = `Team ${i + 1}`;
        inp.value = name;
        // Only redraw the bracket view while typing so the field keeps focus.
        inp.oninput = (e) => {
          bracket.teams[i] = e.target.value;
          save();
          renderBracket();
        };
        field.appendChild(inp);
        grid.appendChild(field);
      });

      card.appendChild(grid);
      container.appendChild(card);
    });
  }

  // ---------- match rendering ----------
  function teamBox(name, score, isWinner, hasResult, onclick) {
    const box = document.createElement('div');
    box.className = 'team-box' + (isWinner ? ' selected' : (hasResult ? ' loser' : ''));
    box.title = 'Click to set this team as the winner and enter the score';
    box.innerHTML = `<span class="team-name">${esc(name)}</span><span class="team-score">${score ?? ''}</span>`;
    box.onclick = onclick;
    return box;
  }

  function matchEl(key, a, b, label) {
    const res = getRes(key, a, b);
    const match = document.createElement('div');
    match.className = 'match';
    if (label) {
      const l = document.createElement('div');
      l.className = 'match-label';
      l.textContent = label;
      match.appendChild(l);
    }
    match.appendChild(teamBox(a, res?.sa, res?.winner === a, !!res, () => enterScore(key, a, b)));
    match.appendChild(teamBox(b, res?.sb, res?.winner === b, !!res, () => enterScore(key, b, a)));
    return match;
  }

  function roundEl(title, matchEls, kind) {
    const round = document.createElement('div');
    round.className = 'round ' + (kind || 'po');
    round.innerHTML = `<div class="round-title">${esc(title)}</div>`;
    const matches = document.createElement('div');
    matches.className = 'matches';
    if (kind === 'rr') {
      const cols = matchEls.length > 8 ? 3 : matchEls.length > 4 ? 2 : 1;
      matches.style.setProperty('--cols', cols);
    }
    matchEls.forEach(m => matches.appendChild(m));
    round.appendChild(matches);
    return round;
  }

  // ---------- main bracket view ----------
  // Computes the round-robin games and standings of one bracket.
  function buildInfo(bracket, bracketIdx) {
    const active = activeTeamsOf(bracket);
    if (active.length < 2) return null;

    const schedule = generateRoundRobin(active.length);
    const rrMatches = [];
    let gameIdx = 0;
    let completed = 0;
    const standings = active.map(team => ({ team, wins: 0, pf: 0, pa: 0 }));

    schedule.forEach(roundGames => {
      roundGames.forEach(game => {
        const a = active[game.t1];
        const b = active[game.t2];
        const key = `${bracketIdx}_${gameIdx}`;
        const res = getRes(key, a, b);

        if (res) {
          completed++;
          standings[game.t1].pf += res.sa;
          standings[game.t1].pa += res.sb;
          standings[game.t2].pf += res.sb;
          standings[game.t2].pa += res.sa;
          if (res.winner === a) standings[game.t1].wins++;
          else standings[game.t2].wins++;
        }

        rrMatches.push(matchEl(key, a, b));
        gameIdx++;
      });
    });

    const complete = gameIdx > 0 && completed === gameIdx;
    let ranked = null;
    if (complete) {
      // Tie-breakers: wins, then point difference, then points scored
      standings.sort((x, y) =>
        (y.wins - x.wins) ||
        ((y.pf - y.pa) - (x.pf - x.pa)) ||
        (y.pf - x.pf)
      );
      ranked = standings.map(s => s.team);
    }
    return { bracket, bracketIdx, active, rrMatches, complete, ranked };
  }

  function renderBracket() {
    const container = document.getElementById('bracket');
    container.innerHTML = '';

    // Reset podium button until a podium is found
    lastPodium = null;
    document.getElementById('podium-btn').style.display = 'none';

    const infos = data.brackets.map((b, i) => buildInfo(b, i)).filter(Boolean);
    if (!infos.length) {
      container.innerHTML = '<div class="empty">Add at least 2 teams to a bracket to generate matches.</div>';
      return;
    }

    // Exactly two brackets = one combined playoff (Bracket A + Bracket B).
    // Otherwise each bracket runs its own playoff.
    const combined = infos.length === 2;

    infos.forEach(info => {
      const section = document.createElement('div');
      section.className = 'bracket-section';
      section.innerHTML = `<div class="bracket-section-title">${esc(info.bracket.name)}</div>`;
      const row = document.createElement('div');
      row.className = 'tournament-row';
      section.appendChild(row);
      container.appendChild(section);

      row.appendChild(roundEl('Round Robin', info.rrMatches, 'rr'));

      if (!combined && info.ranked) {
        renderPlayoffs(row, info.bracketIdx, info.ranked);
      }
    });

    if (combined) renderCrossPlayoffs(container, infos[0], infos[1]);
  }

  // Combined playoffs for two brackets.
  // Both brackets have 4+ teams: top 4 of each -> Quarter Finals -> Semi Finals -> Finals.
  // Otherwise (a bracket has fewer than 4 teams): top 2 of each -> Semi Finals -> Finals.
  function renderCrossPlayoffs(container, A, B) {
    const k = (A.active.length >= 4 && B.active.length >= 4) ? 4 : 2;

    const section = document.createElement('div');
    section.className = 'bracket-section';
    section.innerHTML = `<div class="bracket-section-title">Playoffs: ${esc(A.bracket.name)} + ${esc(B.bracket.name)}</div>`;
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = k === 4
      ? 'Top 4 from each bracket advance to the Quarter Finals.'
      : 'Top 2 from each bracket advance to the Semi Finals (no Quarter Finals because a bracket has fewer than 4 teams).';
    section.appendChild(note);
    container.appendChild(section);

    if (!A.ranked || !B.ranked) {
      const hint = document.createElement('div');
      hint.className = 'empty';
      hint.textContent = 'Finish all Round Robin games in both brackets to unlock the playoffs.';
      section.appendChild(hint);
      return;
    }

    const row = document.createElement('div');
    row.className = 'tournament-row';
    section.appendChild(row);

    const a = A.ranked;
    const b = B.ranked;

    if (k === 4) {
      // Crossover seeding so the top seeds of each bracket land in opposite halves
      const qf = [
        { a: a[0], b: b[3], key: 'p_qf1' },
        { a: b[1], b: a[2], key: 'p_qf2' },
        { a: b[0], b: a[3], key: 'p_qf3' },
        { a: a[1], b: b[2], key: 'p_qf4' }
      ];
      row.appendChild(roundEl('Quarter Finals', qf.map(q => matchEl(q.key, q.a, q.b))));

      const r = qf.map(q => getRes(q.key, q.a, q.b));
      if (r.every(Boolean)) {
        renderSemiAndFinals(row, 'p',
          { a: r[0].winner, b: r[1].winner },
          { a: r[2].winner, b: r[3].winner });
      }
    } else {
      renderSemiAndFinals(row, 'p', { a: a[0], b: b[1] }, { a: b[0], b: a[1] });
    }
  }

  // Single-bracket playoffs. prefix = bracket index
  function renderPlayoffs(row, prefix, top) {
    if (top.length >= 4) {
      renderSemiAndFinals(row, prefix, { a: top[0], b: top[3] }, { a: top[1], b: top[2] });
    } else {
      renderFinals(row, prefix, { a: top[0], b: top[1] }, null, top[2]);
    }
  }

  function renderSemiAndFinals(row, prefix, s1, s2) {
    const sf1 = { a: s1.a, b: s1.b, key: `${prefix}_sf1` };
    const sf2 = { a: s2.a, b: s2.b, key: `${prefix}_sf2` };

    row.appendChild(roundEl('Semi Finals', [
      matchEl(sf1.key, sf1.a, sf1.b),
      matchEl(sf2.key, sf2.a, sf2.b)
    ]));

    const r1 = getRes(sf1.key, sf1.a, sf1.b);
    const r2 = getRes(sf2.key, sf2.a, sf2.b);
    if (!r1 || !r2) return;

    const loser = (sf, r) => (r.winner === sf.a ? sf.b : sf.a);
    renderFinals(row, prefix,
      { a: r1.winner, b: r2.winner },
      { a: loser(sf1, r1), b: loser(sf2, r2) });
  }

  function renderFinals(row, prefix, champ, third, thirdTeam) {
    const champKey = `${prefix}_champ`;
    const finalsMatches = [matchEl(champKey, champ.a, champ.b, 'Championship')];
    if (third) {
      finalsMatches.push(matchEl(`${prefix}_third`, third.a, third.b, '3rd Place'));
    }
    const finalsEl = roundEl('Finals', finalsMatches);

    const champRes = getRes(champKey, champ.a, champ.b);
    if (champRes) {
      const banner = document.createElement('div');
      banner.className = 'champion';
      banner.textContent = `🏆 Champion: ${champRes.winner}`;
      finalsEl.querySelector('.matches').appendChild(banner);
    }
    row.appendChild(finalsEl);

    // Podium: shows once the final (and the 3rd place game, if any) is done
    if (!champRes) return;
    const first = champRes.winner;
    const second = champRes.winner === champ.a ? champ.b : champ.a;
    let thirdPlace = thirdTeam || null;
    let fourthPlace = null;

    if (third) {
      const tr = getRes(`${prefix}_third`, third.a, third.b);
      if (!tr) return;
      thirdPlace = tr.winner;
      fourthPlace = tr.winner === third.a ? third.b : third.a;
    }
    row.appendChild(podiumEl(first, second, thirdPlace, fourthPlace));
  }

  function podiumEl(first, second, third, fourth) {
    // Store podium data globally and show the button
    lastPodium = { first, second, third, fourth };
    document.getElementById('podium-btn').style.display = '';

    const step = (cls, medal, place, name) => `
      <div class="podium-step ${cls}">
        <div class="podium-name">${name ? medal + ' ' + esc(name) : ''}</div>
        <div class="podium-block">${name ? place : ''}</div>
      </div>`;

    const round = document.createElement('div');
    round.className = 'round po';
    round.innerHTML = `
      <div class="round-title">Final Ranking</div>
      <div class="matches">
        <div class="podium">
          ${step('p2', '🥈', '2', second)}
          ${step('p1', '🥇', '1', first)}
          ${step('p3', '🥉', '3', third)}
        </div>
        ${fourth ? `<div class="podium-fourth">4th place: ${esc(fourth)}</div>` : ''}
      </div>`;
    return round;
  }

  // ---------- score modal ----------
  // t1 = the team that was clicked (automatically the winner), t2 = opponent
  function enterScore(key, t1, t2) {
    currentMatch = { key, t1, t2 };
    const existing = getRes(key, t1, t2);
    document.getElementById('modalTitle').textContent = `${t1} wins - enter the score`;
    document.getElementById('team1').textContent = t1;
    document.getElementById('team2').textContent = t2;
    // Prefill with winner score first, loser score second
    document.getElementById('score1').value = existing ? Math.max(existing.sa, existing.sb) : '';
    document.getElementById('score2').value = existing ? Math.min(existing.sa, existing.sb) : '';
    document.getElementById('overlay').classList.add('active');
    document.getElementById('modal').classList.add('active');
    document.getElementById('score1').focus();
  }

  function closeModal() {
    document.getElementById('overlay').classList.remove('active');
    document.getElementById('modal').classList.remove('active');
    currentMatch = null;
  }

  function saveScore() {
    if (!currentMatch) return;
    const s1 = parseInt(document.getElementById('score1').value);
    const s2 = parseInt(document.getElementById('score2').value);

    if (isNaN(s1) || isNaN(s2)) {
      alert('Please enter both scores');
      return;
    }
    if (s1 <= s2) {
      alert(`${currentMatch.t1} is the winner, so their score must be higher than ${currentMatch.t2}'s score`);
      return;
    }

    data.bracket[currentMatch.key] = {
      t1: currentMatch.t1,
      t2: currentMatch.t2,
      s1, s2,
      winner: currentMatch.t1
    };

    save();
    closeModal();
    renderBracket();
  }

  // Enter = save, Esc = cancel
  document.addEventListener('keydown', (e) => {
    if (!currentMatch) return;
    if (e.key === 'Enter') saveScore();
    if (e.key === 'Escape') closeModal();
  });

  function render() {
    renderBrackets();
    renderBracket();
  }

  load();
  if (!data.brackets.length) {
    data.brackets = [
      { name: 'Bracket A', teams: Array(6).fill('') },
      { name: 'Bracket B', teams: Array(6).fill('') }
    ];
    save();
  }
  render();

  // ---------- podium popup ----------
  function openPodiumWindow() {
    if (!lastPodium) return;
    const { first, second, third, fourth } = lastPodium;

    const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🏆 Tournament Podium</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at center, #1a2e1b 0%, #0d180e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Barlow Condensed", system-ui, sans-serif;
      overflow: hidden;
      cursor: move;
      user-select: none;
    }

    /* drag hint */
    .drag-hint {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: rgba(255,255,255,0.35);
      font-family: system-ui; letter-spacing: .04em;
      pointer-events: none;
    }
    .close-btn {
      position: fixed; top: 12px; right: 16px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; border-radius: 8px; padding: 6px 14px;
      font-size: 14px; cursor: pointer; font-family: system-ui;
    }
    .close-btn:hover { background: rgba(255,255,255,0.2); }

    .title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      color: #d4f2a3;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: clamp(2rem, 5vh, 4rem);
      text-shadow: 0 0 40px rgba(122,193,43,0.5);
      animation: fadeDown .6s ease both;
    }

    .podium-wrap {
      display: flex;
      align-items: flex-end;
      gap: clamp(12px, 3vw, 32px);
      animation: fadeUp .7s ease .2s both;
    }

    .step { display: flex; flex-direction: column; align-items: center; }
    .step-name {
      font-size: clamp(1.2rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: #eaeedf;
      margin-bottom: 12px;

      max-width: clamp(140px, 20vw, 260px);

      display: flex; align-items: flex-start; justify-content: center;
      padding-top: 16px;

      margin-top: clamp(1.5rem, 4vh, 3rem);

      animation: fadeUp .7s ease .5s both;

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }

  </style>
</head>
<body>
  <div class="drag-hint">Drag this window to your TV screen, then press F11 for fullscreen</div>
  <button class="close-btn" onclick="window.close()">✕ Close</button>

  <div class="title">🏆 Final Rankings</div>

  <div class="podium-wrap">
    <div class="step p2">
      <div class="medal">🥈</div>
      <div class="step-name">${esc(second || '')}</div>

    </div>
    <div class="step p1">

      <div class="step-name">${esc(first || '')}</div>
      <div class="block">1</div>
    </div>
    <div class="step p3">
      <div class="medal">🥉</div>
      <div class="step-name">${esc(third || '')}</div>
      <div class="block">3</div>
    </div>
  </div>
  <div class="base"></div>

  ${fourth ? `<div class="fourth">4th place: ${esc(fourth)}</div>` : ''}

  <script>
    // Make window draggable (for moving to TV screen)
    let dragging = false, ox = 0, oy = 0;
    document.body.addEventListener('mousedown', e => {
      if (e.target.closest('button')) return;
      dragging = true; ox = e.screenX - window.screenX; oy = e.screenY - window.screenY;
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      window.moveTo(e.screenX - ox, e.screenY - oy);
    });
    document.addEventListener('mouseup', () => dragging = false);
  <\/script>
</body>
</html>`;

    const popup = window.open('', 'podium_tv',
      'width=900,height=700,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no'
    );
    if (!popup) {
      alert('Pop-up blocked! Please allow pop-ups for this site.');
      return;
    }
    popup.document.open();
    popup.document.write(html);
    popup.document.close();
  }
</script>

</body>
